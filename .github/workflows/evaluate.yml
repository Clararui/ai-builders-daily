# Copy to .github/workflows/evaluate.yml in the dedicated PUBLIC repo.
# Manual test only. No paid runner, no model API, no website publish, no email.
name: Free CPU model evaluation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official tools and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fL --retry 2 --max-time 300 -o runtime/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-ubuntu-x64.tar.gz
          echo '91d7b03ddae498a39f28fdb85d84d2b4a0fd3838d10b4f897e0ef8975bb9b583  runtime/llama.tar.gz' | sha256sum -c -
          tar -xzf runtime/llama.tar.gz -C runtime
          curl -fL --retry 2 --max-time 1200 -o runtime/model.gguf https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf
          echo '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5  runtime/model.gguf' | sha256sum -c -
      - name: Run baseline regression
        run: node model-test/evaluate.mjs runtime/llama-b10621/llama-completion runtime/model.gguf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation
          path: model-test/results-4b/
          retention-days: 3

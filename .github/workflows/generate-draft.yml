name: Generate daily draft
on:
  workflow_dispatch:
    inputs:
      test_only_urls:
        description: 'Optional comma-separated source URLs for regression tests only'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  generate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch central feed using Follow Builders prepare script
        run: |
          mkdir -p runtime
          node scripts/prepare-digest.mjs > runtime/feed.json
      - name: Download verified CPU tools
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 300 -o runtime/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-ubuntu-x64.tar.gz
          echo '91d7b03ddae498a39f28fdb85d84d2b4a0fd3838d10b4f897e0ef8975bb9b583  runtime/llama.tar.gz' | sha256sum -c -
          tar -xzf runtime/llama.tar.gz -C runtime
          curl -fL --retry 2 --max-time 1200 -o runtime/model.gguf https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/7c41481f57cb95916b40956ab2f0b139b296d974/Qwen3-8B-Q4_K_M.gguf
          echo 'd98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785  runtime/model.gguf' | sha256sum -c -
      - name: Generate Chinese draft without publishing
        env:
          TEST_ONLY_URLS: ${{ inputs.test_only_urls }}
        run: node draft.mjs runtime/feed.json runtime/llama-b10621/llama-completion runtime/model.gguf draft-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-draft
          path: draft-output/*.json
          retention-days: 3
